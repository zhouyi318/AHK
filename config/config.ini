; ===== 传奇私服挂机脚本 - 全局配置 =====
; 修改本文件或通过 GUI 操作均可。窗口信息由 GUI 瞄准镜自动写入。

[Window]
; 游戏进程名/标题/句柄（由 GUI 窗口选择器自动填入）
ExeName=Trae.exe
Title=Main.ahk - AHKV2 - Trae
Hwnd=264244
; 期望客户区分辨率
ExpectedWidth=2673
ExpectedHeight=1712

[Images]
; 以下图片均放在 assets\ 目录，填写文件名
; 盟重土城特征图（检测是否在土城）
Town=town.bmp
; 自动挂机按钮图（点击开启挂机）
AutoFightBtn=autofight_btn.bmp
; 挂机已开启图标（校验挂机是否开启）
AutoFightOn=autofight_on.bmp
; 盟重回城石图（挂机失败兜底回城）
ReturnStone=return_stone.bmp
; 掉线重连按钮图
Disconnect=btn_reconnect.bmp
; 死亡复活按钮图
Dead=btn_revive.bmp

[ImageRegions]
; 系统内置找图区域，格式 x1,y1,x2,y2（相对绑定窗口客户区）
; 留空表示搜索整个绑定窗口
Town=
AutoFightBtn=
AutoFightOn=
ReturnStone=
Disconnect=
Dead=

[Hotkey]
; 启动/暂停热键
StartStop=F8
; 急停热键
EmergencyStop=F12

[Bot]
; 主循环间隔（毫秒）
TickMs=500
; 找图相似度 0~1（越大越严格，浏览器场景建议从 0.75 起试）
Sim=0.60
; 开启挂机失败重试次数
AutoFightRetry=3
; 定时存仓间隔（分钟）
StoreIntervalMin=60
; 监测状态检查间隔（毫秒）
MonitorIntervalMs=10000

[Paths]
; 模板图目录（相对脚本目录）
AssetsDir=assets
; 日志目录（相对脚本目录）
LogDir=logs
; 脚本目录（相对脚本目录，存放录制的进图脚本 json）
ScriptsDir=scripts


















